<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Attendance Access - ACE</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% include 'includes/theme_config.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body
    class="bg-[#0f172a] text-slate-300 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
    x-data="emergencyHandler()">

    <!-- Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-red-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-blue-600/10 rounded-full blur-[100px]"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-500/10 text-red-500 mb-4 border border-red-500/20">
                <i class="fas fa-siren-on text-3xl"></i>
            </div>
            <h1 class="text-3xl font-display font-bold text-white mb-2">Emergency Access</h1>
            <p class="text-slate-400 text-sm">Valid Auth Code required for entry</p>
        </div>

        <!-- Step 1: Code Verification -->
        <div x-show="step === 1" x-transition:enter="transition ease-out duration-300 opacity-0 scale-95"
            class="glass-panel p-8 rounded-3xl shadow-2xl">
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Access
                        Code</label>
                    <input type="text" x-model="accessCode"
                        class="w-full bg-[#1e293b] border border-slate-700 text-white text-center text-2xl font-mono tracking-[0.5em] py-4 rounded-xl focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-colors uppercase placeholder-slate-700"
                        placeholder="--------" maxlength="8">
                </div>

                <div x-show="errorMessage" x-cloak
                    class="p-3 bg-red-900/20 border border-red-900/50 rounded-lg text-red-400 text-sm text-center">
                    <i class="fas fa-circle-exclamation mr-2"></i><span x-text="errorMessage"></span>
                </div>

                <button @click="verifyCode()" :disabled="isLoading || accessCode.length < 4"
                    class="w-full py-4 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold rounded-xl transition-all shadow-lg shadow-red-900/20 flex items-center justify-center gap-2">
                    <span x-if="isLoading"><i class="fas fa-spinner fa-spin"></i></span>
                    <span x-text="isLoading ? 'Verifying...' : 'Verify Access'"></span>
                </button>
            </div>
            <div class="mt-6 text-center">
                <a href="{{ url_for('login_page') }}"
                    class="text-slate-500 hover:text-white text-xs font-bold uppercase tracking-widest transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Home
                </a>
            </div>
        </div>

        <!-- Step 2: Session Details -->
        <div x-show="step === 2" x-cloak x-transition:enter="transition ease-out duration-300 opacity-0 scale-95"
            class="glass-panel p-8 rounded-3xl shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Access Granted
            </h3>

            <form action="{{ url_for('emergency_start_session') }}" method="POST" class="space-y-5">
                <input type="hidden" name="access_code" :value="accessCode">

                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Department</label>
                    <select name="department" required
                        class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.name }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Batch
                            (Year)</label>
                        <select name="batch_year" required
                            class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                            <option value="">Select Batch</option>
                            {% for batch in batches %}
                            <option value="{{ batch.name }}">{{ batch.name }} (Year {{ batch.current_year_display }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Semester</label>
                        <select name="semester" required
                            class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                            {% for i in range(1, 9) %}
                            <option value="{{ i }}">Semester {{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Period</label>
                        <select name="period" required
                            class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                            {% for i in range(1, 9) %}
                            <option value="{{ i }}">Period {{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Subject</label>
                        <select name="subject" required
                            class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                            <option value="">Select Subject</option>
                            {% for sub in subjects %}
                            <option value="{{ sub.name }}">{{ sub.name }} ({{ sub.code or 'N/A' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Staff Name /
                        Invigilator</label>
                    <input type="text" name="staff_name" required placeholder="Enter your full name"
                        class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Reason</label>
                    <select name="reason" required
                        class="w-full bg-[#1e293b] border border-slate-700 text-white p-3 rounded-lg focus:border-blue-500 outline-none">
                        <option value="Teacher Absent">Teacher Absent</option>
                        <option value="Extra Class">Extra Class</option>
                        <option value="Lab Session">Lab Session</option>
                        <option value="Exam Duty">Exam Duty</option>
                        <option value="Event/Workshop">Event/Workshop</option>
                    </select>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2 mt-4">
                    Start Session <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function emergencyHandler() {
            return {
                step: 1,
                accessCode: '',
                isLoading: false,
                errorMessage: '',

                async verifyCode() {
                    this.isLoading = true;
                    this.errorMessage = '';

                    try {
                        const response = await fetch('/emergency-access/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code: this.accessCode })
                        });

                        const data = await response.json();

                        if (data.valid) {
                            this.step = 2;
                        } else {
                            this.errorMessage = data.message || 'Invalid Code';
                        }
                    } catch (e) {
                        this.errorMessage = 'Connection Error';
                    } finally {
                        this.isLoading = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
