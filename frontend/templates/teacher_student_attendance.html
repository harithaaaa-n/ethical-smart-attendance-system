<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.full_name }} Attendance</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: white;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #2d2d2d;
        }

        th {
            background-color: #1a1a1a;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    <header class="bg-[#141414] border-b border-gray-800 p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="{{ url_for('teacher_dashboard') }}" class="p-2 rounded-lg hover:bg-gray-800">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 class="font-bold">{{ student.full_name }}'s Attendance</h2>
        </div>
        <div class="flex items-center space-x-4">
            <p class="text-sm">Welcome, <span class="font-semibold">{{ session.full_name }}</span></p>
            <a href="{{ url_for('logout') }}" class="text-red-400 hover:text-red-300">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center p-6 bg-[#0f0f0f]">
        <div class="container mx-auto card p-6">
            <h1 class="text-2xl font-bold mb-4 text-center">Attendance Records for {{ student.full_name }}</h1>

            <div class="overflow-x-auto card p-4 mb-4">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for record in attendance %}
                        <tr>
                            <td>{{ record.timestamp | replace(' 00:00:00', '') }}</td>
                            <td>{{ record.subject }}</td>
                            <td>
                                <span class="px-2 py-1 rounded-full text-xs font-semibold
                                    {% if record.status == 'Present' %}bg-green-900 text-green-300
                                    {% elif record.status == 'OD' %}bg-blue-900 text-blue-300
                                    {% else %}bg-red-900 text-red-300{% endif %}">
                                    {{ record.status }}
                                </span>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
